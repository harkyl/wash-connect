services:
  - type: web
    name: wash-connect-backend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false